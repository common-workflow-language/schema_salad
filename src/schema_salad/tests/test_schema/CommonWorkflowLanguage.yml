$base: "https://w3id.org/cwl/cwl#"

$namespaces:
  cwl: "https://w3id.org/cwl/cwl#"
  sld: "https://w3id.org/cwl/salad#"

$graph:

- $import: Process.yml
- $import: CommandLineTool.yml
- $import: Workflow.yml

- name: CWLInputFile
  type: map
  values:
    - "null"
    - CWLObjectType
  doc: |
    Type representing a valid CWL input file as a `map<string, CWLObjectType>`.
  jsonldPredicate:
    _id: "cwl:inputfile"
    _container: "@list"
    noLinkCheck: true
